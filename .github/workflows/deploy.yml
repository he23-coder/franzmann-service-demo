name: Verificar y desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typen und Seiten bauen
        env:
          # Nach dem ersten Veröffentlichen hier die echte Worker-Adresse
          # eintragen, damit canonical, Open Graph und Sitemap stimmen.
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: Auf Cloudflare Workers veröffentlichen
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
